embedding_model: nomic-embed-text
generation_model: qwen2.5-coder:7b
ollama_url: http://localhost:11434
state_dir: ~/.local/share/glean
max_context_chars: 12000
top_k: 30
bm25_top_k: 50
rrf_k: 60
max_distance: 0.65

collections:
  glean:
    paths:
      - .
    include:
      - "*.py"
      - "*.md"
      - "*.yaml"
      - "*.yml"
    exclude:
      - ".git/"

  starshot:
    paths:
      - ~/starshot/arrow_acquisition
      - ~/starshot/champion
      - ~/starshot/formula_win
      - ~/starshot/intelligenz
      - ~/starshot/maverick
      - ~/starshot/payloads
      - ~/starshot/sop
      - ~/starshot/spotlight
      - ~/starshot/triple_blitz
    include:
      - "*.py"
      - "*.php"
      - "*.ts"
      - "*.tsx"
      - "*.js"
      - "*.jsx"
      - "*.md"
      - "*.yaml"
      - "*.yml"
      - "*.json"
      - "*.sh"
    exclude:
      - ".git/"
      - "node_modules/"
      - "vendor/"
      - "dist/"
      - "build/"
      - ".next/"
      - "venv/"
      - ".venv*/"
      - "storage/"
      - "bootstrap/cache/"
      - "public/build/"
      - "tests/"
      - "*.min.js"
      - "package-lock.json"
      - "yarn.lock"
      - "composer.lock"

  starshot_wp:
    paths:
      - ~/starshot_codebases/formulawin
      - ~/starshot_codebases/projectarrow2
      - ~/starshot_codebases/tripleblitz
    include:
      - "*.php"
      - "*.js"
      - "*.ts"
      - "*.md"
      - "*.json"
      - "*.yaml"
      - "*.yml"
      - "*.css"
    exclude:
      - ".git/"
      - "node_modules/"
      - "vendor/"
      - "uploads/"
      - "*.min.js"
      - "*.min.css"
      - "wp-core/"

  code:
    paths:
      - ~/code/ansible-playbooks
      - ~/code/app.fitter.live
      - ~/code/app.jalalio.com
      - ~/code/app.pollzapper.com
      - ~/code/app.yotober.com
      - ~/code/aprenter.com
      - ~/code/diskpulse
      - ~/code/moilab
    include:
      - "*.py"
      - "*.php"
      - "*.ts"
      - "*.tsx"
      - "*.js"
      - "*.jsx"
      - "*.md"
      - "*.yaml"
      - "*.yml"
      - "*.json"
      - "*.sh"
      - "*.conf"
    exclude:
      - ".git/"
      - "node_modules/"
      - "vendor/"
      - "dist/"
      - "build/"
      - ".next/"
      - "venv/"
      - ".venv*/"
      - "storage/"
      - "bootstrap/cache/"
      - "public/build/"
      - "tests/"
      - "*.min.js"
      - "package-lock.json"
      - "yarn.lock"
      - "composer.lock"
